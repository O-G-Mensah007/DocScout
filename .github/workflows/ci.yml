name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. The action errors out when it is given
      # one *and* package.json has `packageManager`, which is the single source
      # of truth for the pnpm version.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # The extraction eval runs against fixtures committed in
      # packages/pipeline/eval/fixtures. It does not call the network.
      # It fails the build if precision on the golden set regresses.
      - name: Extraction eval (golden set)
        run: pnpm eval
        env:
          EVAL_MODE: offline
